<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maha Mohamed | Backend AI Engineer</title>
  <meta name="description" content="Maha Mohamed, backend AI engineer in Cairo. I build AI that shows its work.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="favicon-180.png">
  <style>
    @font-face{font-family:"Space Grotesk";font-weight:700;font-display:swap;src:url(fonts/space-grotesk-latin-700-normal.woff2) format("woff2")}
    @font-face{font-family:"Inter";font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format("woff2")}
    @font-face{font-family:"Inter";font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format("woff2")}
    :root{--ink:#0F1B2D;--paper:#F6F7F9;--teal:#0B7F73;--amber:#FF7A45}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,sans-serif}
    main{max-width:640px}
    h1{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:clamp(2.4rem,9vw,4rem);line-height:1.05;margin:0 0 16px}
    p{font-size:1.15rem;line-height:1.5;margin:0 0 12px}
    .soon{display:inline-block;margin-top:20px;padding:6px 12px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:600;font-size:.9rem}
    .dot{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--amber);margin-right:8px}
  </style>
</head>
<body>
  <main>
    <h1>Maha Mohamed</h1>
    <p>I build AI that shows its work.</p>
    <p style="color:var(--teal);font-weight:600">Backend AI engineer, Cairo.</p>
    <span class="soon"><span class="dot"></span>Portfolio coming soon</span>
  </main>
</body>
</html>
